name: tests
on: [push, pull_request]
jobs:
  local-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q ambient main.py tools tests
      - run: python -m unittest discover -s tests -v
